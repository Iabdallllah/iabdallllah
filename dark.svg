        <g font-size="9.5" font-weight="600" letter-spacing="1.15" text-anchor="middle" fill="url(#ascii-grad)">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.5; 0,0" dur="6s" repeatCount="indefinite" />
          <text x="250" y="136" opacity="0.55">· · · · · · · . . : : + + : : . . · · · · · · ·<animate attributeName="opacity" values="0;0.55" dur="0.2s" begin="0.05s" fill="freeze" /></text>
