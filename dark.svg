          <text x="250" y="196" opacity="0.96">· · · * @ % + . : * # % % # * : . + % @ * · · ·<animate attributeName="opacity" values="0;0.96" dur="0.2s" begin="0.23s" fill="freeze" /></text>
          <text x="250" y="206" opacity="0.98">· · · # @ # . [ # @ % ] · [ % @ # ] . # @ # · · ·<animate attributeName="opacity" values="0;0.98" dur="0.2s" begin="0.26s" fill="freeze" /></text>
          <text x="250" y="216" opacity="0.95">· · · + @ % : . : + * : : * + : . : % @ + · · ·<animate attributeName="opacity" values="0;0.95" dur="0.2s" begin="0.29s" fill="freeze" /></text>
