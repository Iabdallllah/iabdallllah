<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" fill="none" role="img" aria-label="Abdallah Khalifa — Applied AI Engineer specializing in Generative AI, LLM-Powered Applications, RAG Pipelines, AI Agents, and Machine Learning">
  <title>Abdallah Khalifa — Applied AI Engineer</title>
  <desc>Interactive terminal and system dashboard profile banner for Abdallah Khalifa, Applied AI Engineer in Alexandria, Egypt. Showcases Generative AI, RAG Pipelines, Agentic AI, Machine Learning stack, and featured systems.</desc>

  <defs>
    <!-- Background & Ambient Gradients -->
    <linearGradient id="bg-base" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="52%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>

    <radialGradient id="orb-violet" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.16;0.26;0.16" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-cyan" cx="82%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.10;0.18" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-emerald" cx="65%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.10;0.18;0.10" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Border & Accent Gradient -->
    <linearGradient id="border-shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.65">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.55">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.65">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="55%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="ascii-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="55%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glass-reflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.07" />
      <stop offset="35%" stop-color="#F8FAFC" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="tech-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="24" cy="24" r="0.7" fill="#22D3EE" fill-opacity="0.14" />
    </pattern>

    <!-- Scanline Overlay Pattern -->
    <pattern id="crt-lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#030712" stroke-width="1" stroke-opacity="0.28" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Frame Clip -->
    <clipPath id="frame-clip">
      <rect x="16" y="16" width="1148" height="578" rx="22" />
    </clipPath>

    <!-- Portrait Viewport Clip -->
    <clipPath id="portrait-clip">
      <rect x="60" y="118" width="380" height="254" rx="12" />
    </clipPath>

    <!-- Typing Reveal Clip Paths for Role Rotation -->
    <clipPath id="type-clip-1">
      <rect x="634" y="196" height="24" width="190">
        <animate attributeName="width" values="0;190;190;0;0" keyTimes="0;0.08;0.21;0.24;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="type-clip-2">
      <rect x="634" y="196" height="24" width="0">
        <animate attributeName="width" values="0;0;232;232;0;0" keyTimes="0;0.25;0.33;0.46;0.49;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="type-clip-3">
      <rect x="634" y="196" height="24" width="0">
        <animate attributeName="width" values="0;0;242;242;0;0" keyTimes="0;0.50;0.58;0.71;0.74;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="type-clip-4">
      <rect x="634" y="196" height="24" width="0">
        <animate attributeName="width" values="0;0;298;298;0" keyTimes="0;0.75;0.83;0.96;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- ================= MAIN OUTER CANVAS ================= -->
  <g clip-path="url(#frame-clip)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <!-- Base Surface -->
    <rect x="16" y="16" width="1148" height="578" rx="22" fill="url(#bg-base)" />
    <rect x="16" y="16" width="1148" height="578" fill="url(#orb-violet)" />
    <rect x="16" y="16" width="1148" height="578" fill="url(#orb-cyan)" />
    <rect x="16" y="16" width="1148" height="578" fill="url(#orb-emerald)" />
    <rect x="16" y="16" width="1148" height="578" fill="url(#tech-grid)" />

    <!-- Subtle Floating Particles -->
    <circle cx="140" cy="96" r="1.5" fill="#22D3EE" opacity="0.45">
      <animate attributeName="cy" values="96;82;96" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="436" cy="540" r="1.8" fill="#A78BFA" opacity="0.4">
      <animate attributeName="cy" values="540;524;540" dur="7.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1088" cy="112" r="1.5" fill="#10B981" opacity="0.45">
      <animate attributeName="cy" values="112;128;112" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="960" cy="558" r="1.4" fill="#22D3EE" opacity="0.35">
      <animate attributeName="cy" values="558;542;558" dur="6.8s" repeatCount="indefinite" />
    </circle>

    <!-- ================= TOP TERMINAL / EDITOR CHROME BAR ================= -->
    <rect x="16" y="16" width="1148" height="44" fill="#0F172A" fill-opacity="0.72" />
    <line x1="16" y1="60" x2="1164" y2="60" stroke="#1E293B" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="44" cy="38" r="6" fill="#EF4444" fill-opacity="0.9" />
    <circle cx="64" cy="38" r="6" fill="#F59E0B" fill-opacity="0.9" />
    <circle cx="84" cy="38" r="6" fill="#10B981" fill-opacity="0.9" />

    <!-- Terminal Host Prompt -->
    <text x="112" y="42" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="0.4">Iabdallllah@profile:~</text>

    <!-- Editor Navigation Tabs (Decorative) -->
    <g font-size="11" fill="#64748B" letter-spacing="0.8">
      <rect x="444" y="25" width="64" height="26" rx="6" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="0.8" />
      <text x="476" y="42" fill="#22D3EE" font-weight="600" text-anchor="middle">Code</text>
      <text x="554" y="42" text-anchor="middle">Projects</text>
      <text x="642" y="42" text-anchor="middle">Experience</text>
      <text x="726" y="42" text-anchor="middle">Contact</text>
    </g>

    <!-- Status Indicator -->
    <rect x="1044" y="26" width="98" height="24" rx="12" fill="#064E3B" fill-opacity="0.35" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="1060" cy="38" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="1098" y="42" fill="#6EE7B7" font-size="11" font-weight="600" letter-spacing="0.8" text-anchor="middle">ONLINE</text>

    <!-- ================= LEFT COLUMN: VISUAL.MAP / IDENTITY (38.5% WIDTH) ================= -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;1" dur="0.45s" fill="freeze" />

      <!-- Left Glass Card -->
      <rect x="36" y="76" width="428" height="500" rx="16" fill="#0F172A" fill-opacity="0.35" stroke="#1E293B" stroke-width="1.2" />
      <rect x="36" y="76" width="428" height="500" rx="16" fill="url(#glass-reflect)" />
      <line x1="36" y1="108" x2="464" y2="108" stroke="#1E293B" stroke-width="1" />

      <!-- Left Card Header -->
      <circle cx="56" cy="92" r="3.5" fill="#22D3EE" />
      <text x="68" y="96" fill="#F8FAFC" font-size="11" font-weight="700" letter-spacing="1.5">VISUAL.MAP</text>
      <text x="446" y="96" fill="#64748B" font-size="10" letter-spacing="0.8" text-anchor="end">[ ASCII.RENDER // 46x21 ]</text>

      <!-- ASCII Portrait Inner Frame (Centered at x=250) -->
      <rect x="60" y="118" width="380" height="254" rx="12" fill="#030712" fill-opacity="0.68" stroke="#1E293B" stroke-width="1" />

      <!-- Corner Reticles inside Portrait Frame -->
      <path d="M 68 134 L 68 126 L 76 126" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.7" />
      <path d="M 432 134 L 432 126 L 424 126" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.7" />
      <path d="M 68 356 L 68 364 L 76 364" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.7" />
      <path d="M 432 356 L 432 364 L 424 364" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.7" />

      <!-- Dense Monospace ASCII Portrait (Head + Shoulders + Upper Chest, Centered at x=250) -->
